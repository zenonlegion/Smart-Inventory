<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Folk Stock</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--surf:#fff;--ink:#111827;--mute:#586174;--line:#e1e6f0;--soft:#eaeefa;--acc:#4f46e5;--onacc:#fff;--warn:#8a5200;--warnbg:#fdf0d8;--bad:#a1302a;--badbg:#fbe6e4;--ok:#1d6a44;--okbg:#e1f2e8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--surf:#151b26;--ink:#eaf0fa;--mute:#93a0b6;--line:#243044;--soft:#1c2535;--warn:#f0bf6a;--warnbg:#3a2d12;--bad:#f09a94;--badbg:#3b1d1b;--ok:#7fd3a5;--okbg:#14301f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1117;--surf:#151b26;--ink:#eaf0fa;--mute:#93a0b6;--line:#243044;--soft:#1c2535;--warn:#f0bf6a;--warnbg:#3a2d12;--bad:#f09a94;--badbg:#3b1d1b;--ok:#7fd3a5;--okbg:#14301f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surf);z-index:10}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(2rem,5vw,3.1rem);line-height:1.08;font-weight:600;letter-spacing:-.025em}
h2{font-size:1.5rem;font-weight:600;letter-spacing:-.015em}
h3{font-size:1.02rem;font-weight:600}
.mute{color:var(--mute)}.sm{font-size:.875rem}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--surf);border-bottom:1px solid var(--line);z-index:9}
.bar{display:flex;align-items:center;gap:20px;height:60px}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:1.08rem;letter-spacing:-.01em;border:0;background:none;color:var(--ink);cursor:pointer;font-family:inherit;padding:0}
.mark{width:22px;height:22px;border-radius:6px;background:var(--acc);display:grid;place-items:center}
.mark i{width:8px;height:8px;border-radius:50%;background:var(--onacc)}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav button{border:0;background:none;color:var(--mute);font:500 .93rem inherit;font-family:inherit;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button[aria-current=page]{color:var(--ink);background:var(--soft)}
.av{width:34px;height:34px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font-weight:600;font-size:.82rem;border:0;cursor:pointer;flex:none;font-family:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{padding:40px 0 64px;min-height:70vh}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--acc);background:var(--acc);color:var(--onacc);font:600 .92rem inherit;font-family:inherit;padding:10px 18px;border-radius:9px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:6px 12px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:default}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0;overflow-x:auto}
.tabs button{border:0;background:none;font:500 .92rem inherit;font-family:inherit;color:var(--mute);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--acc)}
.dash{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-top:20px;align-items:start}
.ol{display:grid;grid-template-columns:100px 1fr 24px;gap:10px;align-items:center;font-size:.88rem;margin-top:14px}
.ol i{display:block;height:10px;border-radius:5px;min-width:4px}
.ol b{text-align:right}
.qa{display:flex;gap:10px;flex-wrap:wrap}
.item{flex-wrap:wrap}
.panel{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:20px}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.tag{display:inline-block;font-size:.76rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.tag.ok{background:var(--okbg);color:var(--ok)}.tag.warn{background:var(--warnbg);color:var(--warn)}.tag.bad{background:var(--badbg);color:var(--bad)}.tag.n{background:var(--soft);color:var(--mute)}
.stats{display:flex;gap:36px;flex-wrap:wrap;margin:18px 0 6px}
.stats b{display:block;font-size:1.9rem;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surf)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:.92rem;vertical-align:middle}
th{font-weight:500;color:var(--mute);font-size:.82rem}
tr:last-child td{border-bottom:0}
td .q{display:inline-flex;align-items:center;gap:8px}
.q button{width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--surf);color:var(--ink);cursor:pointer;font-size:1rem;line-height:1;padding:0}
input,select,textarea{font:inherit;font-size:.93rem;color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:9px;padding:9px 12px;width:100%}
textarea{resize:vertical;min-height:80px}
label{display:block;font-size:.84rem;font-weight:500;margin-bottom:5px}
.add{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:16px}
.fld{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fld .full{grid-column:1/-1}
.goods{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.good{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.good .pr{font-size:1.2rem;font-weight:600}
.good s{color:var(--mute);font-size:.88rem;margin-left:6px;font-weight:400}
.good .btn{margin-top:auto;align-self:flex-start}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.plan{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px}
.plan.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.plan .pr{font-size:2rem;font-weight:600;letter-spacing:-.02em}
.plan ul{margin:0;padding:0;list-style:none;display:grid;gap:7px;font-size:.92rem}
.plan li:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--acc);margin-right:9px}
.plan .btn{margin-top:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--surf)}
.seg button{border:0;background:none;color:var(--mute);font:500 .88rem inherit;font-family:inherit;padding:6px 14px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--soft);color:var(--ink)}
.prof{display:grid;grid-template-columns:1fr 300px;gap:32px;align-items:start}
.big{width:64px;height:64px;font-size:1.3rem}
.sw{display:flex;gap:10px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--surf);outline:1px solid var(--line);cursor:pointer}
.sw button[aria-pressed=true]{outline:2px solid var(--ink)}
.tg{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:1px solid var(--line);gap:16px}
.tg:first-child{border-top:0}
.tg input{width:20px;height:20px;accent-color:var(--acc)}
.empty{padding:36px;text-align:center;color:var(--mute);border:1px dashed var(--line);border-radius:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:.9rem;z-index:20}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--mute);font-size:.85rem}
@media(max-width:820px){.dash,.prof{grid-template-columns:1fr}.add{grid-template-columns:1fr 1fr}.add>:first-child{grid-column:1/-1}.fld{grid-template-columns:1fr}}
@media(prefers-reduced-motion:no-preference){.toast{animation:t .2s ease}@keyframes t{from{opacity:0;transform:translate(-50%,8px)}}}
</style>
</head>
<body>
<header><div class="wrap bar">
<button class="logo" data-a="go" data-t="home"><span class="mark"><i></i></span>Folk Stock</button>
<nav id="nav" aria-label="Main"></nav>
<button class="av" id="avb" data-a="go" data-t="profile" aria-label="Open profile"></button>
</div></header>
<main><div class="wrap" id="app"></div></main>
<footer><div class="wrap">Folk Stock · Stock, expiry and restocking for small shops. Demo with sample data; nothing is charged.</div></footer>
<div id="toast" class="toast" hidden role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=n=>'₹'+Number(n).toLocaleString('en-IN');
const TABS=[['home','Home'],['inventory','Inventory'],['marketplace','Marketplace'],['plans','Subscriptions'],['profile','Profile']];
const def={inv:[
{id:1,name:'Basmati rice 5 kg',cat:'Staples',qty:24,min:10,days:300,p:520},
{id:2,name:'Full-cream milk 1 L',cat:'Dairy',qty:6,min:12,days:2,p:62},
{id:3,name:'Whole wheat bread',cat:'Bakery',qty:9,min:8,days:1,p:45},
{id:4,name:'Arabica beans 1 kg',cat:'Café',qty:4,min:5,days:120,p:980},
{id:5,name:'Paneer 200 g',cat:'Dairy',qty:14,min:6,days:4,p:95},
{id:6,name:'Mustard oil 1 L',cat:'Staples',qty:18,min:8,days:200,p:180},
{id:7,name:'Bananas, dozen',cat:'Produce',qty:3,min:5,days:-1,p:60}],
mine:[],reserved:[],plan:null,billing:'m',onboard:false,invF:'all',mk:'deals',q:'',pt:'biz',nid:20,
p:{name:'Asha Roy',biz:'Roy Provisions',type:'Grocery store',city:'Kolkata',branches:1,bio:'',accent:'#4f46e5',theme:'system',n:{expiry:true,restock:true,deals:false}}};
let S;
try{const r=localStorage.getItem('folkstock');S=r?Object.assign({},def,JSON.parse(r)):structuredClone(def)}catch(e){S=structuredClone(def)}
const save=()=>{try{localStorage.setItem('folkstock',JSON.stringify(S))}catch(e){}};
if(S.p.accent==='#2f6b4f')S.p.accent='#4f46e5';
const DEALS=[
{id:'d1',seller:'Sen Bakery',name:'Multigrain loaf ×12',price:32,was:45,tag:'Near expiry',loc:'Salt Lake',note:'Best before in 2 days'},
{id:'d2',seller:'Dey Dairy',name:'Curd 400 g ×30',price:28,was:38,tag:'Near expiry',loc:'Gariahat',note:'Best before in 3 days'},
{id:'d3',seller:'Patel Mart',name:'Basmati rice 5 kg ×10',price:410,was:520,tag:'Surplus',loc:'Howrah',note:'Overstock, sealed bags'},
{id:'d4',seller:'Café Ruchi',name:'Croissants ×16',price:24,was:60,tag:'Near expiry',loc:'Park Street',note:'Baked yesterday'},
{id:'d5',seller:'Green Basket',name:'Mixed vegetables 5 kg',price:140,was:220,tag:'Surplus',loc:'Behala',note:'Pick up before 6 pm'}];
const SUPP=[
{id:'s1',seller:'Bengal Agro Wholesale',name:'Rice, pulses, flour',note:'Minimum order ₹5,000 · delivers in 2 days',loc:'Howrah'},
{id:'s2',seller:'Ganga Dairy Co-op',name:'Milk, curd, paneer, ghee',note:'Daily morning delivery · cold chain',loc:'Barasat'},
{id:'s3',seller:'Sundarban Honey Collective',name:'Honey and local preserves',note:'Minimum order ₹2,000 · weekly delivery',loc:'Canning'},
{id:'s4',seller:'Fresh Fields Farmers Group',name:'Seasonal fruit and vegetables',note:'Order by 8 pm for next-day delivery',loc:'Nadia'}];
const PLANS=[
{id:'starter',name:'Starter',m:499,for:'One shop or café',f:['Up to 300 products','Expiry and low-stock alerts','Marketplace listings','Email support']},
{id:'growth',name:'Growth',m:1299,for:'Busy shops that want insight',f:['Unlimited products','Premium inventory analytics','Waste and demand reports','Priority support']},
{id:'multi',name:'Multi-branch',m:2999,for:'Up to 10 branches',f:['Everything in Growth','Stock view across branches','Transfers between branches','Role-based team access']}];
const SETUP=2500;
const st=i=>{const t=[];if(i.days<0)t.push(['bad','Expired']);else if(i.days<=5)t.push(['warn','Expires in '+i.days+' d']);if(i.qty<=i.min)t.push(['warn','Restock']);if(!t.length)t.push(['ok','Healthy']);return t};
const tagH=t=>t.map(x=>`<span class="tag ${x[0]}">${x[1]}</span>`).join(' ');
const attn=()=>S.inv.filter(i=>i.days<=5||i.qty<=i.min).sort((a,b)=>a.days-b.days);
const init=()=>(S.p.name.trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2)||'FS').toUpperCase();
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}
function applyTheme(){const r=document.documentElement;S.p.theme==='system'?r.removeAttribute('data-theme'):r.setAttribute('data-theme',S.p.theme);r.style.setProperty('--acc',S.p.accent)}
const tab=()=>{const h=location.hash.slice(1);return TABS.some(t=>t[0]===h)?h:'home'};
const tabsH=(items,cur,a)=>`<div class="tabs" role="tablist">${items.map(([k,l])=>`<button role="tab" aria-selected="${cur===k}" data-a="${a}" data-v="${k}">${l}</button>`).join('')}</div>`;

function home(){const a=attn(),first=esc(S.p.name.trim().split(/\s+/)[0]||'there'),hr=new Date().getHours(),g=hr<12?'morning':hr<17?'afternoon':'evening';
const risk=S.inv.filter(i=>i.days<=5).reduce((s,i)=>s+i.qty*i.p,0);
const bk=[['Expired',i=>i.days<0,'--bad'],['Next 2 days',i=>i.days>=0&&i.days<=2,'--warn'],['3 to 5 days',i=>i.days>=3&&i.days<=5,'--warn'],['6 to 30 days',i=>i.days>=6&&i.days<=30,'--acc'],['Over 30 days',i=>i.days>30,'--ok']].map(x=>[x[0],S.inv.filter(x[1]).length,x[2]]);
const mx=Math.max(1,...bk.map(x=>x[1]));
return `<h1 style="font-size:2rem">Good ${g}, ${first}</h1>
<p class="mute">${esc(S.p.biz)} · ${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</p>
<div class="stats"><div><b>${S.inv.length}</b><span class="mute sm">products tracked</span></div><div><b>${S.inv.filter(i=>i.days<=5).length}</b><span class="mute sm">expiring within 5 days</span></div><div><b>${S.inv.filter(i=>i.qty<=i.min).length}</b><span class="mute sm">to restock</span></div><div><b>${inr(risk)}</b><span class="mute sm">stock value at risk</span></div></div>
${S.plan?'':`<div class="panel" style="display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-top:18px"><div><h3>You’re on the free demo</h3><p class="mute sm">Choose a plan to unlock alerts, analytics and marketplace selling.</p></div><button class="btn sm" data-a="go" data-t="plans">View plans</button></div>`}
<div class="dash"><div class="panel"><h3>Needs attention</h3><p class="mute sm" style="margin-bottom:6px">${a.length} of ${S.inv.length} products, most urgent first</p>
${a.map(i=>`<div class="item"><div><b>${esc(i.name)}</b><div style="margin-top:4px">${tagH(st(i))}</div></div><span style="display:flex;gap:6px;flex-wrap:wrap">${i.days>=0&&i.days<=5?`<button class="btn ghost sm" data-a="list" data-id="${i.id}">Sell on marketplace</button>`:''}${i.days<0?`<button class="btn ghost sm" data-a="del" data-id="${i.id}">Remove</button>`:''}${i.qty<=i.min&&i.days>=0?`<button class="btn sm" data-a="restock" data-id="${i.id}">Mark restocked</button>`:''}</span></div>`).join('')||'<p class="mute">Everything looks healthy.</p>'}</div>
<div class="panel"><h3>Expiry outlook</h3><p class="mute sm">Products by time left</p>${bk.map(x=>`<div class="ol"><span>${x[0]}</span><i style="width:${x[1]/mx*100}%;background:var(${x[2]})"></i><b>${x[1]}</b></div>`).join('')}</div></div>
<h3 style="margin:30px 0 12px">Quick actions</h3><div class="qa"><button class="btn" data-a="go" data-t="inventory">Add or update stock</button><button class="btn ghost" data-a="go" data-t="marketplace">Browse surplus deals</button><button class="btn ghost" data-a="go" data-t="marketplace">Find suppliers</button><button class="btn ghost" data-a="go" data-t="profile">Edit profile</button></div>`}

function inventory(){const f=S.invF;let rows=S.inv.filter(i=>f==='all'||(f==='exp'&&i.days<=5)||(f==='low'&&i.qty<=i.min));
const val=S.inv.reduce((s,i)=>s+i.qty*i.p,0);
return `<h2>Inventory</h2><p class="mute">${esc(S.p.biz)}${S.p.city?' · '+esc(S.p.city):''}</p>
<div class="stats"><div><b>${S.inv.length}</b><span class="mute sm">products</span></div><div><b>${S.inv.filter(i=>i.days<=5).length}</b><span class="mute sm">expiring or expired</span></div><div><b>${S.inv.filter(i=>i.qty<=i.min).length}</b><span class="mute sm">to restock</span></div><div><b>${inr(val)}</b><span class="mute sm">stock value</span></div></div>
${tabsH([['all','All products'],['exp','Expiring soon'],['low','Low stock']],f,'invF')}
<div class="add"><div><label for="an">Product</label><input id="an" placeholder="e.g. Oat milk 1 L"></div><div><label for="aq">Quantity</label><input id="aq" type="number" min="0" value="10"></div><div><label for="am">Minimum</label><input id="am" type="number" min="0" value="5"></div><div><label for="ad">Days to expiry</label><input id="ad" type="number" value="30"></div><button class="btn" data-a="add">Add product</button></div>
${rows.length?`<div class="scroll"><table><thead><tr><th>Product</th><th>Category</th><th>Quantity</th><th>Expiry</th><th>Status</th><th></th></tr></thead><tbody>${rows.map(i=>`<tr><td><b>${esc(i.name)}</b></td><td class="mute">${esc(i.cat)}</td><td><span class="q"><button data-a="dec" data-id="${i.id}" aria-label="Decrease">−</button>${i.qty}<button data-a="inc" data-id="${i.id}" aria-label="Increase">+</button></span><span class="mute sm"> / min ${i.min}</span></td><td>${i.days<0?'Expired':i.days>=100?'In '+Math.round(i.days/30)+' months':'In '+i.days+' d'}</td><td>${tagH(st(i))}</td><td style="white-space:nowrap">${i.days<=5&&i.days>=0?`<button class="btn ghost sm" data-a="list" data-id="${i.id}">Sell on marketplace</button> `:''}<button class="btn ghost sm" data-a="del" data-id="${i.id}">Remove</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No products match this view.</div>'}`}

function market(){const k=S.mk,q=S.q.toLowerCase();const m=x=>!q||(x.name+x.seller).toLowerCase().includes(q);
let body;
if(k==='deals')body=`<div class="goods">${DEALS.filter(m).map(d=>{const r=S.reserved.includes(d.id);return `<div class="good"><span><span class="tag warn">${d.tag}</span></span><h3>${d.name}</h3><div class="pr">${inr(d.price)}<s>${inr(d.was)}</s></div><p class="mute sm">${d.seller} · ${d.loc}<br>${d.note}</p><button class="btn ${r?'ghost':''} sm" data-a="res" data-id="${d.id}">${r?'Reserved · undo':'Reserve'}</button></div>`}).join('')}</div>`;
else if(k==='sup')body=`<div class="goods">${SUPP.filter(m).map(d=>`<div class="good"><span><span class="tag n">Supplier</span></span><h3>${d.seller}</h3><p>${d.name}</p><p class="mute sm">${d.note} · ${d.loc}</p><button class="btn ghost sm" data-a="quote" data-n="${d.seller}">Request quote</button></div>`).join('')}</div>`;
else body=S.mine.length?`<div class="goods">${S.mine.filter(m).map(d=>`<div class="good"><span><span class="tag ok">Your listing</span></span><h3>${esc(d.name)}</h3><div class="pr">${inr(d.price)}<s>${inr(d.was)}</s></div><p class="mute sm">${d.qty} units · ${d.note}</p><button class="btn ghost sm" data-a="unlist" data-id="${d.id}">Remove listing</button></div>`).join('')}</div>`:'<div class="empty">You have no listings. Open Inventory and choose “Sell on marketplace” on an item that expires soon.</div>';
return `<h2>Marketplace</h2><p class="mute" style="max-width:60ch">Buy discounted surplus from nearby shops, find suppliers to restock from, and sell your own near-expiry stock.</p>
${tabsH([['deals','Surplus deals'],['sup','Suppliers'],['mine','My listings ('+S.mine.length+')']],k,'mk')}
<div style="max-width:360px;margin-bottom:18px"><label for="sq" class="mute">Search</label><input id="sq" type="search" placeholder="Search products or sellers" value="${esc(S.q)}"></div>${body}
${S.reserved.length?`<p class="mute sm" style="margin-top:18px">${S.reserved.length} deal${S.reserved.length>1?'s':''} reserved. Sellers will confirm pickup times.</p>`:''}`}

function plans(){const y=S.billing==='y',price=p=>y?Math.round(p.m*10/12):p.m;
const cur=PLANS.find(p=>p.id===S.plan);const total=cur?(y?cur.m*10:cur.m)+(S.onboard?SETUP:0):0;
return `<h2>Subscriptions</h2><p class="mute" style="max-width:60ch">Pick the plan that matches your business. Change or cancel whenever you like.</p>
<div style="margin:22px 0"><div class="seg" role="group" aria-label="Billing period"><button data-a="bill" data-v="m" aria-pressed="${!y}">Monthly</button><button data-a="bill" data-v="y" aria-pressed="${y}">Yearly · 2 months free</button></div></div>
<div class="plans">${PLANS.map(p=>`<div class="plan ${S.plan===p.id?'sel':''}"><h3>${p.name}</h3><p class="mute sm">${p.for}</p><div class="pr">${inr(price(p))}<span class="mute sm" style="font-weight:400"> /month</span></div>${y?`<p class="mute sm">Billed ${inr(p.m*10)} a year</p>`:''}<ul>${p.f.map(x=>`<li>${x}</li>`).join('')}</ul><button class="btn ${S.plan===p.id?'ghost':''}" data-a="plan" data-id="${p.id}">${S.plan===p.id?'Current plan':'Choose '+p.name}</button></div>`).join('')}</div>
<div class="panel" style="margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap"><div><h3>Setup and onboarding</h3><p class="mute sm">We import your product list, set minimum levels and train your team. One-time ${inr(SETUP)}.</p></div><label style="display:flex;gap:10px;align-items:center;margin:0"><input type="checkbox" id="ob" style="width:20px;height:20px;accent-color:var(--acc)" ${S.onboard?'checked':''}>Add onboarding</label></div>
<div class="panel" style="margin-top:16px"><h3>Your order</h3>${cur?`<div class="item"><span>${cur.name} plan, ${y?'yearly':'monthly'}</span><b>${inr(y?cur.m*10:cur.m)}</b></div>${S.onboard?`<div class="item"><span>Setup and onboarding</span><b>${inr(SETUP)}</b></div>`:''}<div class="item"><span><b>Due today</b></span><b>${inr(total)}</b></div>`:'<p class="mute">Choose a plan to see your total.</p>'}</div>`}

function profile(){const P=S.p,pt=S.pt;let b;
if(pt==='biz')b=`<div class="fld"><div><label for="p_name">Your name</label><input id="p_name" data-p="name" value="${esc(P.name)}"></div><div><label for="p_biz">Business name</label><input id="p_biz" data-p="biz" value="${esc(P.biz)}"></div>
<div><label for="p_type">Business type</label><select id="p_type" data-p="type">${['Grocery store','Café','Bakery','General store','Restaurant'].map(o=>`<option ${o===P.type?'selected':''}>${o}</option>`).join('')}</select></div><div><label for="p_city">City</label><input id="p_city" data-p="city" value="${esc(P.city)}"></div>
<div><label for="p_br">Number of branches</label><input id="p_br" type="number" min="1" data-p="branches" value="${P.branches}"></div><div></div>
<div class="full"><label for="p_bio">About your business</label><textarea id="p_bio" data-p="bio" placeholder="Shown to buyers on the marketplace">${esc(P.bio)}</textarea></div></div>`;
else if(pt==='look')b=`<label>Accent colour</label><div class="sw" style="margin-bottom:24px">${[['#4f46e5','Indigo'],['#0f766e','Teal'],['#be185d','Rose'],['#c2410c','Orange'],['#334155','Slate']].map(c=>`<button style="background:${c[0]}" data-a="acc" data-v="${c[0]}" aria-label="${c[1]}" aria-pressed="${P.accent===c[0]}"></button>`).join('')}</div>
<label>Theme</label><div class="seg">${['system','light','dark'].map(t=>`<button data-a="theme" data-v="${t}" aria-pressed="${P.theme===t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>`;
else b=`<div>${[['expiry','Expiry alerts','Tell me when products are close to expiring.'],['restock','Restock alerts','Tell me when stock drops below its minimum.'],['deals','Marketplace deals','Tell me about new surplus deals nearby.']].map(n=>`<div class="tg"><div><h3>${n[1]}</h3><p class="mute sm">${n[2]}</p></div><input type="checkbox" data-n="${n[0]}" ${P.n[n[0]]?'checked':''} aria-label="${n[1]}"></div>`).join('')}</div>`;
return `<h2>Profile</h2><p class="mute">Make Folk Stock yours. Changes save automatically.</p>
<div class="prof"><div>${tabsH([['biz','Business'],['look','Appearance'],['not','Notifications']],pt,'pt')}${b}</div><div class="panel" id="pv"></div></div>`}
function pv(){const el=$('#pv');if(!el)return;const P=S.p,pl=PLANS.find(p=>p.id===S.plan);
el.innerHTML=`<div class="av big">${init()}</div><h3 style="margin-top:14px">${esc(P.biz)||'Your business'}</h3><p class="mute sm">${esc(P.name)} · ${esc(P.type)}${P.city?' · '+esc(P.city):''}</p>${P.bio?`<p class="sm" style="margin-top:10px">${esc(P.bio)}</p>`:''}<div class="item" style="margin-top:14px"><span class="mute sm">Plan</span><span>${pl?pl.name:'None yet'}</span></div><div class="item"><span class="mute sm">Branches</span><span>${P.branches}</span></div><div class="item"><span class="mute sm">Products</span><span>${S.inv.length}</span></div>${pl?'':'<button class="btn sm" style="margin-top:10px" data-a="go" data-t="plans">Choose a plan</button>'}`}

function render(){const t=tab();$('#nav').innerHTML=TABS.map(([k,l])=>`<button data-a="go" data-t="${k}" ${k===t?'aria-current="page"':''}>${l}</button>`).join('');
$('#avb').textContent=init();$('#app').innerHTML=({home,inventory,marketplace:market,plans,profile})[t]();pv();applyTheme()}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,id=+b.dataset.id,v=b.dataset.v,it=S.inv.find(i=>i.id===id);
if(a==='go'){location.hash=b.dataset.t;scrollTo(0,0);return}
if(a==='invF')S.invF=v;
else if(a==='mk')S.mk=v;
else if(a==='pt')S.pt=v;
else if(a==='bill')S.billing=v;
else if(a==='inc')it.qty++;
else if(a==='restock'){it.qty=Math.max(it.qty,it.min*2);toast('Marked restocked')}
else if(a==='dec')it.qty=Math.max(0,it.qty-1);
else if(a==='del'){S.inv=S.inv.filter(i=>i.id!==id);toast('Removed '+it.name)}
else if(a==='add'){const n=$('#an').value.trim();if(!n){toast('Enter a product name first');return}S.inv.unshift({id:S.nid++,name:n,cat:'General',qty:+$('#aq').value||0,min:+$('#am').value||0,days:+$('#ad').value||0,p:100});toast('Added '+n)}
else if(a==='list'){if(S.mine.some(m=>m.id==='m'+id)){toast('Already listed');return}S.mine.push({id:'m'+id,name:it.name,qty:it.qty,price:Math.round(it.p*.7),was:it.p,note:'Expires in '+it.days+' d'});toast('Listed on marketplace')}
else if(a==='unlist')S.mine=S.mine.filter(m=>m.id!==b.dataset.id);
else if(a==='res'){const k=b.dataset.id;S.reserved=S.reserved.includes(k)?S.reserved.filter(x=>x!==k):[...S.reserved,k];toast(S.reserved.includes(k)?'Reserved':'Reservation cancelled')}
else if(a==='quote')toast('Quote requested from '+b.dataset.n);
else if(a==='plan'){S.plan=b.dataset.id;toast('Plan selected')}
else if(a==='acc')S.p.accent=v;
else if(a==='theme')S.p.theme=v;
save();render()});
document.addEventListener('input',e=>{const t=e.target;
if(t.dataset.p){S.p[t.dataset.p]=t.type==='number'?Math.max(1,+t.value||1):t.value;save();pv();$('#avb').textContent=init()}
else if(t.id==='sq'){S.q=t.value;const p=t.selectionStart;render();const n=$('#sq');n.focus();n.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{const t=e.target;
if(t.id==='ob'){S.onboard=t.checked;save();render()}
else if(t.dataset.n){S.p.n[t.dataset.n]=t.checked;save();toast('Preferences saved')}
else if(t.dataset.p){save();render()}});
addEventListener('hashchange',render);render();
</script>
</body>
</html>
